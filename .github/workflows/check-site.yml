name: Check static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/prepare.py --check
      - run: node --check assets/js/site.js
      - run: node --check go/assets/go.js
      - run: node --check assets/js/metrocop-timeline.js
      - run: node --test scripts/site.test.cjs scripts/metrocop-archive.test.cjs scripts/metrocop-timeline.test.cjs
